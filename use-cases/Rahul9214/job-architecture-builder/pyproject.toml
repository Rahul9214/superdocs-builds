[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-architecture-builder"
version = "0.1.0"
description = "Job architecture and levelling framework builder"
requires-python = ">=3.11"
# httpx is the only runtime HTTP client: explicit connect/read timeouts,
# streaming export, and MockTransport for offline SuperDocs contract tests.
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
