<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SuperDocs Agent Review Workspace</title>
<style>
:root{--bg:#f6f3ef;--surface:#fff;--ink:#211f26;--muted:#716b74;--border:#ded8d2;--primary:#6d3cc7;--primary-soft:#f1ebfb;--coral:#e46d52;--green:#26735b;--green-soft:#eaf5f0;--red:#b44545;--red-soft:#fbecec;--amber:#9a651a;--amber-soft:#fff4e4;--shadow:0 12px 30px rgba(36,25,44,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-rows:58px 1fr 68px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:#fbfaf8;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(145deg,var(--primary),#a46ce4);display:grid;place-items:center;color:#fff;font-weight:800}.brand-title{font-weight:750}.brand-sub{color:var(--muted);font-size:12px}.top-stats{display:flex;gap:8px}.chip{border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:#fff;color:var(--muted)}.chip.alert{border-color:#efb1a3;color:#9d432f;background:#fff4f0}
.workspace{display:grid;grid-template-columns:290px minmax(480px,1fr) 330px;min-height:0}.rail,.inspector{background:#fbfaf8;overflow:auto}.rail{border-right:1px solid var(--border);padding:16px}.inspector{border-left:1px solid var(--border);padding:18px}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:800}.run-card{border:1px solid var(--border);background:#fff;border-radius:14px;padding:13px;margin:10px 0 14px;box-shadow:0 4px 14px rgba(28,21,32,.04)}.run-title{display:flex;align-items:center;justify-content:space-between}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}.timeline{margin-top:10px;display:grid;gap:8px}.step{display:flex;gap:8px;color:var(--muted);font-size:12px}.step strong{color:var(--ink)}
.change-list{display:grid;gap:8px}.change-row{width:100%;border:1px solid transparent;background:transparent;border-radius:12px;padding:10px;text-align:left;display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center;color:var(--ink);cursor:pointer}.change-row:hover{background:#fff;border-color:var(--border)}.change-row.active{background:var(--primary-soft);border-color:#d7c5f4}.row-main{display:grid;gap:2px}.row-main small{color:var(--muted);font-size:11px}.agent-dot{width:8px;height:8px;border-radius:50%}.cursor{background:var(--primary)}.claude{background:var(--coral)}.pill{border-radius:999px;padding:3px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;background:#eee}.pill.pending{background:var(--amber-soft);color:var(--amber)}.pill.approved,.pill.applied{background:var(--green-soft);color:var(--green)}.pill.rejected,.pill.reverted{background:var(--red-soft);color:var(--red)}
.main{padding:20px 24px;overflow:auto}.main-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}.doc-title{font-size:21px;font-weight:780}.doc-meta{color:var(--muted);font-size:12px;margin-top:3px}.counter{color:var(--muted);font-size:12px}.diff-grid{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}.pane{padding:18px;min-height:250px}.pane+.pane{border-left:1px solid var(--border)}.pane.before{background:#fffaf8}.pane.after{background:#f8fcfa}.pane-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:18px}.doc-block{font-family:Georgia,serif;font-size:18px;line-height:1.7}.deleted{background:#fde8e3;text-decoration:line-through;text-decoration-color:#cf7665;border-radius:4px;padding:2px 4px}.added{background:#dff3e8;border-radius:4px;padding:2px 4px}.context{margin-top:16px;border:1px solid var(--border);border-radius:14px;background:#fff;padding:14px}.context h3{margin:0 0 6px;font-size:13px}.context p{margin:0;color:var(--muted)}
.verify-card{border:1px solid var(--border);border-radius:14px;background:#fff;padding:14px;margin-top:10px}.verify-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.verify-badge{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700}.verify-badge.verified{background:var(--green-soft);color:var(--green)}.verify-badge.mismatch{background:var(--red-soft);color:var(--red)}.quote{background:#f7f5f2;border-radius:10px;padding:10px;margin:6px 0 12px;color:#4f4952}.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.meta{border-top:1px solid var(--border);padding-top:8px}.meta small{display:block;color:var(--muted)}
.bottom{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-top:1px solid var(--border);background:#fbfaf8;position:sticky;bottom:0}.actions{display:flex;gap:9px}.btn{border:1px solid var(--border);background:#fff;color:var(--ink);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:650}.btn:hover{transform:translateY(-1px)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--red)}.btn.ghost{background:transparent}.decision-summary{font-size:12px;color:var(--muted)}
.toast{position:fixed;right:20px;bottom:84px;background:#211f26;color:white;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.workspace{grid-template-columns:240px 1fr}.inspector{display:none}}@media(max-width:760px){.workspace{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid var(--border)}.diff-grid{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--border)}.top-stats{display:none}.bottom{align-items:flex-start;gap:10px;padding:10px;flex-direction:column}.actions{flex-wrap:wrap}}
</style></head>
<body><div id="app"></div><div class="toast" id="toast"></div>
<script>
const initialState={documents:[{id:'vendor-agreement',name:'vendor-agreement.docx',owner:'Legal Ops'},{id:'implementation-plan',name:'implementation-plan.docx',owner:'Delivery'}],changes:[
{id:'chg-1',documentId:'vendor-agreement',agent:'Cursor Agent',turn:18,section:'Clause 8.2 · Renewal notice',before:'Either party may terminate the agreement with 30 days written notice.',after:'Either party may terminate the agreement with 45 days written notice.',claim:'Updated the renewal notice from 30 days to 45 days.',actual:'The document now states 45 days written notice in Clause 8.2.',verification:'verified',status:'pending'},
{id:'chg-2',documentId:'vendor-agreement',agent:'Cursor Agent',turn:18,section:'Support escalation',before:'The vendor will respond to urgent support requests and coordinate escalation through the designated account contact.',after:'Urgent support requests route through the designated account contact for coordinated escalation.',claim:'Made the support escalation paragraph more concise without changing meaning.',actual:'Only the support escalation paragraph changed; the escalation owner remains the same.',verification:'verified',status:'pending'},
{id:'chg-3',documentId:'vendor-agreement',agent:'Cursor Agent',turn:18,section:'Payment terms',before:'Invoices are payable Net 30 from receipt.',after:'Invoices are payable Net 45 from receipt.',claim:'No unrelated clauses were changed.',actual:'Payment terms changed from Net 30 to Net 45 even though the request did not mention payments.',verification:'mismatch',status:'pending'},
{id:'chg-4',documentId:'implementation-plan',agent:'Claude Code',turn:7,section:'Current status',before:'Pilot deployment starts after security review.',after:'Pilot deployment starts after security review.',claim:'Updated the current status to note that security review is complete.',actual:'No corresponding document change was found.',verification:'mismatch',status:'pending'}],selectedChangeId:'chg-1'};
let state=JSON.parse(JSON.stringify(initialState));
const esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(){const s=state.changes.find(c=>c.id===state.selectedChangeId)||state.changes[0];const pending=state.changes.filter(c=>c.status==='pending').length;const mismatch=state.changes.filter(c=>c.verification==='mismatch').length;const rows=state.changes.map(c=>`<button class="change-row ${c.id===s.id?'active':''}" onclick="selectChange('${c.id}')"><span class="agent-dot ${c.agent.includes('Cursor')?'cursor':'claude'}"></span><span class="row-main"><strong>${esc(c.agent)}</strong><small>Turn ${c.turn} · ${esc(c.section)}</small></span><span class="pill ${c.status}">${c.status}</span></button>`).join('');
document.getElementById('app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">S</div><div><div class="brand-title">SuperDocs Agent Review</div><div class="brand-sub">Human control for agent-driven document changes</div></div></div><div class="top-stats"><span class="chip">${state.documents.length} documents</span><span class="chip">${pending} pending</span><span class="chip alert">${mismatch} mismatches</span></div></header><section class="workspace"><aside class="rail"><div class="eyebrow">Agent run</div><div class="run-card"><div class="run-title"><strong>${esc(s.agent)}</strong><span class="status-dot"></span></div><div class="timeline"><div class="step">✓ <span><strong>Opened document</strong><br>${esc(s.documentId)}.docx</span></div><div class="step">✓ <span><strong>Located target</strong><br>${esc(s.section)}</span></div><div class="step">◉ <span><strong>Proposed changes</strong><br>Waiting on human review</span></div><div class="step">○ <span><strong>Export</strong><br>Blocked until review completes</span></div></div></div><div class="eyebrow">Changes</div><div class="change-list">${rows}</div></aside><main class="main"><div class="main-head"><div><div class="eyebrow">Document change</div><div class="doc-title">${esc(state.documents.find(d=>d.id===s.documentId)?.name||s.documentId)}</div><div class="doc-meta">${esc(s.section)} · ${esc(s.agent)} · Turn ${s.turn}</div></div><div class="counter">${state.changes.indexOf(s)+1} / ${state.changes.length}</div></div><div class="diff-grid"><section class="pane before"><div class="pane-label">Before</div><div class="doc-block"><span class="deleted">${esc(s.before)}</span></div></section><section class="pane after"><div class="pane-label">After</div><div class="doc-block"><span class="added">${esc(s.after)}</span></div></section></div><div class="context"><h3>Review scope</h3><p>Only this proposed section is in scope. Approving or rejecting it does not change the other review items.</p></div></main><aside class="inspector"><div class="eyebrow">Verification</div><div class="verify-card"><div class="verify-head"><strong>Claim vs actual</strong><span class="verify-badge ${s.verification}">${s.verification==='verified'?'✓ Verified':'⚠ Mismatch'}</span></div><small>AGENT CLAIM</small><div class="quote">${esc(s.claim)}</div><small>ARTIFACT CHECK</small><div class="quote">${esc(s.actual)}</div><div class="meta-grid"><div class="meta"><small>Agent</small>${esc(s.agent)}</div><div class="meta"><small>Status</small>${esc(s.status)}</div><div class="meta"><small>Document</small>${esc(s.documentId)}</div><div class="meta"><small>Turn</small>${s.turn}</div></div></div></aside></section><footer class="bottom"><div class="decision-summary">Review is explicit. Nothing is exported until the reviewer decides.</div><div class="actions"><button class="btn ghost" onclick="resetDemo()">Reset demo</button><button class="btn" onclick="exportEvidence()">Export evidence</button><button class="btn danger" onclick="decision('rejected')">Reject</button><button class="btn primary" onclick="decision('approved')">Approve & continue</button><button class="btn" onclick="exportReview()">Export review summary</button></div></footer></div>`}
function selectChange(id){state.selectedChangeId=id;render()}
function decision(status){const id=state.selectedChangeId;state.changes=state.changes.map(c=>c.id===id?{...c,status}:c);const next=state.changes.find(c=>c.status==='pending');if(next)state.selectedChangeId=next.id;render();toast(status==='approved'?'Change approved':'Change rejected')}
function resetDemo(){state=JSON.parse(JSON.stringify(initialState));render();toast('Demo reset')}
function download(name,type,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
function exportEvidence(){download('superdocs-review-evidence.json','application/json',JSON.stringify({generatedAt:new Date().toISOString(),product:'SuperDocs Agent Review Workspace',documents:state.documents,decisions:state.changes},null,2));toast('Evidence JSON exported')}
function exportReview(){const lines=['SuperDocs Agent Review Workspace','',...state.changes.map(c=>`${c.section} | ${c.status.toUpperCase()} | ${c.verification.toUpperCase()}\nAgent: ${c.agent}\nClaim: ${c.claim}\nActual: ${c.actual}\n`)];download('review-summary.txt','text/plain',lines.join('\n'));toast('Review summary exported')}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
render();
</script></body></html>
